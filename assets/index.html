<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fc">
  <title>科技观察</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="#observe" aria-label="科技观察首页"><span class="brand-mark" aria-hidden="true"><i></i><b></b></span><span>科技观察<small>A股与ETF研究台</small></span></a>
      <button id="refresh-button" class="icon-button" aria-label="同步行情与历史数据" title="同步数据"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.3 7a7 7 0 0 1 11.5-2L20 8M4 16l2.2 3A7 7 0 0 0 17.7 17"/></svg></button>
    </header>
    <div class="connection-line"><span id="connection-status" role="status"><i class="status-dot"></i>正在载入真实样本</span><span id="asof-label">—</span></div>
    <main id="main-content" tabindex="-1">
      <section id="page-observe" class="page active" aria-labelledby="observe-heading"></section>
      <section id="page-detail" class="page" aria-labelledby="detail-heading" hidden></section>
      <section id="page-news" class="page" aria-labelledby="news-heading" hidden></section>
      <section id="page-backtest" class="page" aria-labelledby="backtest-heading" hidden></section>
      <section id="page-model" class="page" aria-labelledby="model-heading" hidden></section>
    </main>
    <nav class="bottom-nav" aria-label="主要功能">
      <button data-tab="observe" class="active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 7-9M17 5h3v3M4 21h17"/></svg><span>观察</span></button>
      <button data-tab="detail"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18M3 7h6v8H3M17 2v20M14 6h6v12h-6"/></svg><span>详情</span></button>
      <button data-tab="news"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h5"/></svg><span>资讯</span></button>
      <button data-tab="backtest"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h17M7 15l4-5 4 3 5-7M17 6h3v3"/></svg><span>回测</span></button>
      <button data-tab="model"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l5-4 5 4v10l-5 4-5-4zM3 9h4M17 9h4M3 15h4M17 15h4M10 9h4v6h-4z"/></svg><span>模型</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="seed.js"></script>
  <script src="analysis.js"></script>
  <script src="market.js"></script>
  <script src="forecast-journal.js"></script>
  <script src="corporate-actions.js"></script>
  <script src="corporate-events.js"></script>
  <script src="paper-engine.js"></script>
  <script src="research-results.js"></script>
  <script src="assurance-ui.js"></script>
  <script src="ui.js"></script>
</body>
</html>
